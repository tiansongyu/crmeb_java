server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://crmeb-front:20410;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Demo data stores some images as relative crmebimage paths. Proxy them to
    # the verified image host instead of returning index.html as a fake image.
    location /crmebimage/ {
        proxy_pass https://apia.beta.crmeb.xbdzz.cn/crmebimage/;
        proxy_ssl_server_name on;
        proxy_set_header Host apia.beta.crmeb.xbdzz.cn;
        proxy_intercept_errors on;
        error_page 404 = /__image/apia/crmebimage/public/product/2025/05/30/58bde6dca3814cd085fa95e4a02c415dbfvihmv3s0.png;
    }

    location /__image/apia/ {
        proxy_pass https://apia.beta.crmeb.xbdzz.cn/;
        proxy_ssl_server_name on;
        proxy_set_header Host apia.beta.crmeb.xbdzz.cn;
        proxy_intercept_errors on;
        error_page 404 = /__image/apia/crmebimage/public/product/2025/05/30/58bde6dca3814cd085fa95e4a02c415dbfvihmv3s0.png;
    }

    location /__image/oss/ {
        proxy_pass https://crmebjavasingle.oss-cn-beijing.aliyuncs.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host crmebjavasingle.oss-cn-beijing.aliyuncs.com;
        proxy_intercept_errors on;
        error_page 403 404 = /__image/apia/crmebimage/public/product/2025/05/30/32f0ce043dab44fc895bf9cd4440c75aca13ihc7o4.png;
    }

    # HTML 入口文件不缓存，确保用户刷新总能拿到最新 index.html / pc.html，
    # 避免浏览器缓存旧 index.html（引用已不存在的旧 JS，被 try_files 回退成 HTML 导致白屏）。
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
