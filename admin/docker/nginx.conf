server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://crmeb-admin:20400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /captcha/ {
        proxy_pass http://crmeb-admin:20400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /crmebimage/ {
        proxy_pass http://crmeb-admin:20400/crmebimage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 = @remote_crmebimage;
    }

    location @remote_crmebimage {
        proxy_pass https://apia.beta.crmeb.xbdzz.cn;
        proxy_ssl_server_name on;
        proxy_set_header Host apia.beta.crmeb.xbdzz.cn;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
